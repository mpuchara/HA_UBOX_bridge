name: Build and publish CYD browser installer
on:
  push:
    branches: [main]
    paths:
      - 'firmware/cyd_monitor/**'
      - 'web-installer/**'
      - '.github/workflows/cyd-web-installer.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages-cyd
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install toolchain
        run: python -m pip install platformio esptool==4.8.1
      - name: Compile CYD firmware without any user secrets
        run: |
          set -eu
          test ! -f firmware/cyd_monitor/include/config.h
          pio run -d firmware/cyd_monitor
      - name: Merge ESP32 binaries for ESP Web Tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/firmware
          cp web-installer/index.html web-installer/manifest.json web-installer/manifest-ili9341.json site/
          touch site/.nojekyll
          BOOT_APP0=$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)
          test -n "$BOOT_APP0" && test -s "$BOOT_APP0"
          for ENV in esp32-2432s028 esp32-2432s028-ili9341; do
            case "$ENV" in
              esp32-2432s028) NAME=ubox-cyd-esp32.bin ;;
              *) NAME=ubox-cyd-ili9341.bin ;;
            esac
            BUILD="firmware/cyd_monitor/.pio/build/$ENV"
            test -s "$BUILD/bootloader.bin"
            test -s "$BUILD/partitions.bin"
            test -s "$BUILD/firmware.bin"
            python -m esptool --chip esp32 merge_bin \
              --output "site/firmware/$NAME" \
              --flash_mode dio --flash_freq 40m --flash_size 4MB \
              0x1000 "$BUILD/bootloader.bin" \
              0x8000 "$BUILD/partitions.bin" \
              0xe000 "$BOOT_APP0" \
              0x10000 "$BUILD/firmware.bin"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          site = Path("site")
          for manifest_path in ("manifest.json", "manifest-ili9341.json"):
              manifest = json.loads((site / manifest_path).read_text())
              assert manifest["builds"][0]["chipFamily"] == "ESP32"
              for part in manifest["builds"][0]["parts"]:
                  path = site / part["path"]
                  assert path.exists() and path.stat().st_size > 65536, path
          print("Browser installer firmware validated.")
          PY
          sha256sum site/firmware/ubox-cyd-esp32.bin site/firmware/ubox-cyd-ili9341.bin > site/firmware/SHA256SUMS.txt
      - name: Upload browser flasher files
        uses: actions/upload-artifact@v4
        with:
          name: UBox-CYD-browser-installer
          path: site/
          include-hidden-files: true
  release-windows:
    runs-on: ubuntu-latest
    needs: firmware
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: UBox-CYD-browser-installer
          path: site
      - name: Pack Windows browser installer from verified binary
        shell: bash
        run: |
          set -euo pipefail
          test -s site/firmware/ubox-cyd-esp32.bin
          test -s site/firmware/ubox-cyd-ili9341.bin
          cp windows-installer/Start-Installer.cmd windows-installer/Install-CYD.ps1 windows-installer/README.md site/
          sha256sum -c site/firmware/SHA256SUMS.txt
          cd site
          zip -r ../UBox-CYD-Windows-Browser-Installer.zip .
          cd ..
          unzip -t UBox-CYD-Windows-Browser-Installer.zip
      - name: Publish installer ZIP in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("web-installer/manifest.json"))["version"])')
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          TAG="cyd-v${VERSION}-${SHORT_SHA}"
          gh release create "$TAG" UBox-CYD-Windows-Browser-Installer.zip \
            --target "$GITHUB_SHA" --title "CYD Browser Installer $VERSION ($SHORT_SHA)" \
            --notes "Windows portable browser installer (Edge/Chrome). Contains both ST7789 (try first on a two-USB CYD) and ILI9341 builds. Unzip and launch Start-Installer.cmd. Binaries verified in CI." \
            --latest=false --prerelease
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UBox-CYD-browser-installer
          path: site
      - name: Check whether GitHub Pages is enabled
        id: pages_setup
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Pages needs initial activation
        if: steps.pages_setup.outcome != 'success'
        run: echo "::warning::Enable Pages in Settings > Pages > Source GitHub Actions, then rerun this workflow. Windows ZIP is published separately."
      - if: steps.pages_setup.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        if: steps.pages_setup.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish verified UBox Bridge release
on:
  workflow_run:
    workflows: [Validate and package UBox Bridge]
    branches: [main]
    types: [completed]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify HEAD still matches passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(gh api repos/${{ github.repository }}/commits/main --jq .sha)" = "$SOURCE_SHA"
      - name: Skip publishing when only documentation changed
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat ubox_bridge/APP_VERSION)
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG_SHA=$(gh api "repos/${{ github.repository }}/git/ref/tags/v$VERSION" --jq '.object.sha')
          if [[ "$TAG_SHA" == "$SOURCE_SHA" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$TAG_SHA" "$SOURCE_SHA")
          INVALID=$(printf '%s\n' "$CHANGED" | grep -Ev '^$|^docs/|(^|/)README\.md$|^web-installer/index\.html$|^windows-installer/README\.md$|^ubox_bridge/CHANGELOG\.md$|^ha-examples/.*\.yaml$|^scripts/check_docs\.py$|^\.github/workflows/(publish-install-release|validate)\.yml$' || true)
          if [[ -n "$INVALID" ]]; then
            echo "::error::Existing v$VERSION has non-documentation changes: $INVALID. Bump APP_VERSION/config.yaml/Dockerfile to release code changes."
            exit 1
          fi
          echo "Docs-only change since v$VERSION: retaining existing binaries and release tag."
          echo "skip=true" >> "$GITHUB_OUTPUT"
      - name: Install packaging tools
        if: steps.docs.outputs.skip != 'true'
        run: python -m pip install pyyaml
      - name: Package installation ZIPs and verify checksums
        if: steps.docs.outputs.skip != 'true'
        run: |
          python -m unittest discover -s tests -v
          python scripts/package.py
          cd release
          sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub prerelease
        if: steps.docs.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(cat ubox_bridge/APP_VERSION)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            test "$(gh api repos/${{ github.repository }}/git/ref/tags/v$VERSION --jq .object.sha)" = "$SOURCE_SHA"
            gh release upload "v$VERSION" release/*.zip release/SHA256SUMS.txt --clobber
          else
            gh release create "v$VERSION" release/*.zip release/SHA256SUMS.txt --target "$SOURCE_SHA" --title "UBox Bridge $VERSION (experimental)" --notes-file ubox_bridge/CHANGELOG.md --prerelease
          fi

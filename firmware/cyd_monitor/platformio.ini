[env]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI
    bodmer/TJpg_Decoder
    paulstoffregen/XPT2046_Touchscreen@^1.4.0
    tzapu/WiFiManager@^2.0.17
build_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D SPI_FREQUENCY=10000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SUPPORT_TRANSACTIONS=1

; Board with 2 USB sockets (USB-C and micro-USB):
; ST7789 is reported for some such batches. Try this build FIRST for this PCB.
[env:esp32-2432s028]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF

; Fallback for original ILI9341 CYD versions.
[env:esp32-2432s028-ili9341]
build_flags =
    ${env.build_flags}
    -D ILI9341_DRIVER=1

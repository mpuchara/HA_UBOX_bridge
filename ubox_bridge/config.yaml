name: UBox Bridge
version: "0.5.8"
slug: ubox_bridge
description: On-demand and periodic live snapshots for UBox LTE cameras, HA and ESP32 CYD
url: https://github.com/mpuchara/HA_UBOX_bridge
stage: experimental
init: false
startup: application
boot: auto
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: UBox Bridge
panel_admin: true
backup: hot
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: Token-protected JPEG snapshot for CYD on trusted LAN
options:
  account_email: ""
  account_password: ""
  uid: ""
  device_password: ""
  interval_minutes: 15
  live_timeout_seconds: 45
  stream_index: 0
  video_quality: hd
  camera_rotation: 0
  cyd_fit_mode: blur
  cyd_focus_x: 50
  capture_on_start: false
schema:
  account_email: str
  account_password: password
  uid: str
  device_password: password
  interval_minutes: int(0,1440)
  live_timeout_seconds: int(10,75)
  stream_index: int(0,1)
  video_quality: list(hd|sd|manual)
  camera_rotation: int(0,270)
  cyd_fit_mode: str
  cyd_focus_x: int(0,100)
  capture_on_start: bool
